services:
  # ─── 1. PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: farmet_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: farm_et_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d farm_et_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 2. Laravel Backend API ──────────────────────────────────────────────────
  backend:
    build:
      context: ./farm-et-backend
      dockerfile: Dockerfile
    container_name: farmet_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./farm-et-backend/.env
    environment:
      DB_HOST: postgres
      DB_PASSWORD: secretpassword
      DB_CONNECTION: pgsql
      DB_PORT: 5432
      DB_DATABASE: farm_et_db
      DB_USERNAME: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # ─── 3. Next.js Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./farm-et
      dockerfile: Dockerfile
    container_name: farmet_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
